name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        **Never paste your Plex token** (it is in `~/.config/auto-chapter/.env`). Remove anything else you'd rather keep private before you submit.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: The menu choices or commands just before the problem.
      placeholder: |
        1. Main menu → 1) Generate Auto Chapters
        2. ...
  - type: input
    id: version
    attributes:
      label: auto-chapter version
      description: Shown at the top of the menu.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Linux system
      description: The distribution and its version, on the computer auto-chapter runs on.
      placeholder: "Ubuntu 24.04"
    validations:
      required: true
  - type: input
    id: ffmpeg
    attributes:
      label: FFmpeg version (optional)
      description: The first line of `ffmpeg -version`.
      placeholder: "ffmpeg version 7.1.1"
  - type: dropdown
    id: plex
    attributes:
      label: Where is Plex running?
      description: The same question the installer asks.
      options:
        - On this machine (the one auto-chapter runs on)
        - On another machine (for example a NAS)
  - type: dropdown
    id: movies
    attributes:
      label: How does auto-chapter reach the movie files?
      description: auto-chapter reads and writes the movie files themselves, so they must be reachable from the computer it runs on.
      options:
        - They are on the disk of the computer auto-chapter runs on
        - Through a network share mounted on that computer (SMB / CIFS)
        - Through a network share mounted on that computer (NFS)
        - Some other way
  - type: textarea
    id: output
    attributes:
      label: What the app or the installer printed
      description: Copy the text from the terminal.
      render: text
  - type: textarea
    id: log
    attributes:
      label: Log file (optional)
      description: |
        Normally `~/.config/auto-chapter/logs/auto-chapter.log` -- the last few lines are usually enough.
        It can contain movie names, folder paths and your Plex server's address.
      render: text

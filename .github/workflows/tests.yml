# Runs the tests, lint and type check on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --extra dev --python ${{ matrix.python }}
      - name: Tests
        run: uv run pytest
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy src
